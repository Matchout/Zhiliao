name: Build Personal Zhiliao

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build even if upstream unchanged'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

env:
  KEYSTORE_PASS: zhiliao_personal

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup patch
        run: cp patches/zhiliao/FeedTopHotBanner.java /tmp/FeedTopHotBanner.java

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/daxiaamu/Zhiliao.git
          git fetch upstream master --depth=1
          echo "UPSTREAM_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      - name: Restore last synced sha
        id: last-sync
        uses: actions/cache@v4
        with:
          path: last-sync.sha
          key: zhiliao-personal-lastsync

      - name: Decide whether to build
        id: decide
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "force=true，强制构建"
            exit 0
          fi
          if [ -f last-sync.sha ] && [ "$(cat last-sync.sha)" = "$UPSTREAM_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "上游无更新，跳过构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "上游有更新，开始构建"
          fi

      # 方案A：personal 仅作本地构建分支，不推送到远端
      - name: Reset personal to upstream + apply patch
        if: steps.decide.outputs.skip != 'true'
        run: |
          git checkout -B personal FETCH_HEAD
          cp /tmp/FeedTopHotBanner.java \
             app/src/main/java/com/shatyuka/zhiliao/hooks/FeedTopHotBanner.java
          git add app/src/main/java/com/shatyuka/zhiliao/hooks/FeedTopHotBanner.java
          git -c user.name="personal-build" -c user.email="personal@users.noreply.github.com" \
              commit -m "Apply feedtophot data-layer fix (personal)" --allow-empty
          echo "--- patch applied locally (not pushed) ---"
          git --no-pager show --stat --oneline HEAD

      - name: Set up JDK 17
        if: steps.decide.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 37
        if: steps.decide.outputs.skip != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;35.0.0" >/dev/null 2>&1 || true

      - name: Configure Gradle mirrors
        if: steps.decide.outputs.skip != 'true'
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          def MIRRORS = [
            'https://maven-central.storage-download.googleapis.com/maven2',
            'https://maven.aliyun.com/repository/public',
            'https://maven.aliyun.com/repository/google',
            'https://maven.aliyun.com/repository/gradle-plugin',
            'https://dl.google.com/dl/android/maven2',
            'https://plugins.gradle.org/m2'
          ]
          def install = { repos ->
            MIRRORS.each { u -> repos.maven { url = uri(u) } }
          }
          allprojects {
            buildscript { install(repositories) }
            install(repositories)
          }
          settingsEvaluated { settings ->
            try { install(settings.pluginManagement.repositories) } catch (Throwable ignored) {}
            try { install(settings.dependencyResolutionManagement.repositories) } catch (Throwable ignored) {}
          }
          EOF
          echo "--- init.gradle ready ---"

      - name: Cache Gradle
        if: steps.decide.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Restore keystore cache
        if: steps.decide.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/keystore
          key: zhiliao-personal-keystore-v1

      - name: Prepare keystore
        if: steps.decide.outputs.skip != 'true'
        run: |
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore.jks
          elif [ ! -f "$RUNNER_TEMP/keystore/keystore.jks" ]; then
            mkdir -p "$RUNNER_TEMP/keystore"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore/keystore.jks" \
              -storepass "$KEYSTORE_PASS" -alias zhiliao -keypass "$KEYSTORE_PASS" \
              -dname "CN=Personal,O=Personal,C=CN" \
              -keyalg RSA -keysize 2048 -validity 36500
            cp "$RUNNER_TEMP/keystore/keystore.jks" keystore.jks
          else
            cp "$RUNNER_TEMP/keystore/keystore.jks" keystore.jks
          fi

      - name: Build release APK (signed by personal keystore)
        if: steps.decide.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PreleaseStoreFile="$GITHUB_WORKSPACE/keystore.jks" \
            -PreleaseStorePassword="$KEYSTORE_PASS" \
            -PreleaseKeyAlias=zhiliao \
            -PreleaseKeyPassword="$KEYSTORE_PASS"

      - name: Collect APK
        if: steps.decide.outputs.skip != 'true'
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/Zhiliao_*.apk | head -n1)
          echo "found: $APK"
          cp "$APK" dist/Zhiliao-personal.apk
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose dist/Zhiliao-personal.apk
          echo "SHA256: $(sha256sum dist/Zhiliao-personal.apk | cut -d' ' -f1)"

      - name: Record synced sha
        if: steps.decide.outputs.skip != 'true'
        run: echo "$UPSTREAM_SHA" > last-sync.sha

      - name: Upload APK
        if: steps.decide.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zhiliao-personal
          path: dist/Zhiliao-personal.apk

      - name: Get build date
        if: steps.decide.outputs.skip != 'true'
        id: date
        run: echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.decide.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: personal-${{ steps.date.outputs.date }}-${{ env.UPSTREAM_SHA }}
          name: Zhiliao personal ${{ env.UPSTREAM_SHA }}
          files: dist/Zhiliao-personal.apk
          draft: false
          prerelease: false